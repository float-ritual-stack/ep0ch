# The whole suite on Blacksmith runners, billed per minute: about 700 vCPU-minutes a run. The gate is box-test on
# float-box (free); this runs only by hand (`gh workflow run test.yml --ref <branch>`, when float-box can't answer)
# and once a week on main, so a red main is still seen. Evan, Oct 25: ~$500 in a month from running it on every
# push to main, every PR marked ready and by hand per PR head ("insane for a personal project of 1 person").
# Each package's results go out as JUnit XML, which Blacksmith's test analytics reads (per-test history across runs).
name: test
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
  bench:
    # The outline tile's scroll budget over 2,600 notes (PIE-1094): minutes of seeding, so its own job, beside the suites.
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'ci'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: scroll bench (door)
        working-directory: packages/door
        env:
          SCROLL_BENCH: "1"
        run: bun test test/scroll-bench.test.ts
  test:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'ci'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every-key walks use two file shards: a busy runner needs headroom below the 16-minute watchdog.
          - { pkg: door, name: door, runner: blacksmith-16vcpu-ubuntu-2404, args: "--parallel=16 $(find test -name '*.test.ts' ! -name 'parity-*' | sort)" }
          - { pkg: door, name: door-parity-1, runner: blacksmith-16vcpu-ubuntu-2404, args: "--parallel=16 --shard=1/2 $(find test -name 'parity-*.test.ts' | sort)" }
          - { pkg: door, name: door-parity-2, runner: blacksmith-16vcpu-ubuntu-2404, args: "--parallel=16 --shard=2/2 $(find test -name 'parity-*.test.ts' | sort)" }
          - { pkg: outliner, name: outliner, runner: blacksmith-8vcpu-ubuntu-2404, args: "" }
          - { pkg: outline-core, name: outline-core, runner: blacksmith-2vcpu-ubuntu-2404, args: "" }
    runs-on: ${{ matrix.runner }}
    # The run's own 16 minutes, the reruns' 4 and the setup.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: sudo apt-get install -y --no-install-recommends tmux sqlite3 >/dev/null
      - run: bun install --frozen-lockfile
      - name: bun test (${{ matrix.name }})
        id: tests
        working-directory: packages/${{ matrix.pkg }}
        # A private HOME, as box-test gives: no test reads a person's settings.
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          for v in $(compgen -e | grep '^EP0CH_'); do unset "$v"; done
          # A run still going at 16 minutes (a full run takes about 8-13 on a busy runner: the same commit took 558 s on Oct 19 and 765 s on Oct 20) is stopped, after scripts/ci-hang-report.sh has
          # written what each process and the machine were doing to the log and the hang-report artifact. Hung or slow:
          # a run whose output last moved 3 minutes or more before is hung (a worker spinning after its tests, PIE-831);
          # one still passing tests is slow (Oct 13-14: every parity test 2-3x slower at once, PIE-831), said apart.
          # The output is copied to a file (tee) only to see when it last moved.
          # The run is a process group of its own (setsid), so stopping it stops what it started too.
          out="$RUNNER_TEMP/out-${{ matrix.name }}.txt"; machine="$RUNNER_TEMP/machine-${{ matrix.name }}.txt"
          # The machine every 30 s (load, CPU stolen, throttling, the busiest processes): the machine artifact.
          bash ../../scripts/ci-machine-sample.sh "$machine" & sampler=$!
          setsid bun test ${{ matrix.args }} --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit-${{ matrix.name }}.xml" > >(tee "$out") 2>&1 & run=$!
          hung="$RUNNER_TEMP/hung-${{ matrix.name }}"; hang="$RUNNER_TEMP/hang-${{ matrix.name }}.txt"
          ( sleep 960; kill -0 $run 2>/dev/null || exit 0
            quiet=$(( $(date +%s) - $(stat -c %Y "$out" 2>/dev/null || echo 0) ))
            if [ $quiet -ge 180 ]; then echo "hung: no output for ${quiet}s" > "$hung"; else echo "slow: still passing tests (output ${quiet}s ago)" > "$hung"; fi
            timeout 150 bash ../../scripts/ci-hang-report.sh $run "$out" > "$hang" 2>&1 || true
            kill -- -$run 2>/dev/null; sleep 15; kill -9 -- -$run 2>/dev/null; true ) & watchdog=$!
          code=0; wait $run || code=$?
          kill $sampler 2>/dev/null || true
          if [ -e "$hung" ]; then
            wait $watchdog 2>/dev/null || true
            case $(cat "$hung") in
              hung*) echo "::error title=Test run hung::bun test (${{ matrix.name }}) stopped making output and was stopped at 16 minutes ($(cat "$hung")): what it was doing is below and in the hang-report artifact" ;;
              *) echo "::error title=Test run too slow::bun test (${{ matrix.name }}) was still passing tests at 16 minutes, a full run takes about 8-13 ($(cat "$hung")): what the machine was doing is below and in the hang-report artifact" ;;
            esac
            cat "$hang" 2>/dev/null || true
            echo "== the machine through the run (every 30 s)"; cat "$machine" 2>/dev/null || true
            [ $code = 0 ] && code=1
          else
            kill $watchdog 2>/dev/null || true
          fi
          exit $code
      # Which kind of red: each file with a failed test runs again alone, and the summary and annotations say, test by
      # test, "failed again" or "passed alone: a flake". The job stays failed: a flake is reported, never re-run green.
      - name: failed tests, run again alone (${{ matrix.name }})
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: packages/${{ matrix.pkg }}
        run: |
          export HOME="$RUNNER_TEMP/home"
          for v in $(compgen -e | grep '^EP0CH_'); do unset "$v"; done
          bun ../../scripts/ci-rerun-failed.ts "$RUNNER_TEMP/junit-${{ matrix.name }}.xml" packages/${{ matrix.pkg }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.name }}
          path: ${{ runner.temp }}/junit-${{ matrix.name }}.xml
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-${{ matrix.name }}
          path: ${{ runner.temp }}/machine-${{ matrix.name }}.txt
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-report-${{ matrix.name }}
          path: ${{ runner.temp }}/hang-${{ matrix.name }}.txt
          if-no-files-found: ignore
