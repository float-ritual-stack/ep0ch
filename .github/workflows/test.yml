# The whole suite on Blacksmith runners: a merge gate, not a per-push loop (agents iterate on float-box for free).
# Runs on: a push to main (main never goes red silently), a PR marked ready or labelled `ci`, and by hand.
# Each package's results go out as JUnit XML, which Blacksmith's test analytics reads (per-test history across runs).
name: test
on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
  test:
    if: github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.label.name == 'ci'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: door, runner: blacksmith-16vcpu-ubuntu-2404, args: "--parallel=16" }
          - { pkg: outliner, runner: blacksmith-8vcpu-ubuntu-2404, args: "" }
          - { pkg: outline-core, runner: blacksmith-2vcpu-ubuntu-2404, args: "" }
    runs-on: ${{ matrix.runner }}
    # The run's own 12 minutes, the reruns' 4 and the setup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: sudo apt-get install -y --no-install-recommends tmux sqlite3 >/dev/null
      - run: bun install --frozen-lockfile
      - name: bun test (${{ matrix.pkg }})
        id: tests
        working-directory: packages/${{ matrix.pkg }}
        # A private HOME, as box-test gives: no test reads a person's settings.
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          for v in $(compgen -e | grep '^EP0CH_'); do unset "$v"; done
          # A run that hangs (a worker spinning after its tests, seen twice in October: the job ran into its 15 minutes
          # and said nothing) is ended here with a line saying so, short of the job's limit.
          start=$SECONDS; code=0
          timeout --kill-after=15s 720s bun test ${{ matrix.args }} --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit-${{ matrix.pkg }}.xml" || code=$?
          # 137 is a hang only when it came at the deadline (timeout's own kill), not a SIGKILL from elsewhere sooner.
          if [ $code = 124 ] || { [ $code = 137 ] && [ $((SECONDS - start)) -ge 720 ]; }; then echo "::error title=Test run hung::bun test (${{ matrix.pkg }}) didn't finish in 12 minutes (a full run takes about 8): a test or a worker hung"; fi
          exit $code
      # Which kind of red: each file with a failed test runs again alone, and the summary and annotations say, test by
      # test, "failed again" or "passed alone: a flake". The job stays failed: a flake is reported, never re-run green.
      - name: failed tests, run again alone (${{ matrix.pkg }})
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: packages/${{ matrix.pkg }}
        run: |
          export HOME="$RUNNER_TEMP/home"
          for v in $(compgen -e | grep '^EP0CH_'); do unset "$v"; done
          bun ../../scripts/ci-rerun-failed.ts "$RUNNER_TEMP/junit-${{ matrix.pkg }}.xml" packages/${{ matrix.pkg }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.pkg }}
          path: ${{ runner.temp }}/junit-${{ matrix.pkg }}.xml
          if-no-files-found: ignore
