[package]
name = "ep0ch-native-probes"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "W0 probes: questions about Rune that native ep0ch's design rests on, answered by running code. Findings are in ../docs/PROBES.md."
publish = false

# The same Rune as the app (../Cargo.toml), by the same rev and features, so the shared target folder is reused.
[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e", features = ["markdown", "mermaid"] }
serde_json = "1"
# The terminal probe: cell widths, and a CPU glyph rasteriser for the one-image variant. Both are already in Rune's
# own dependency tree at these versions.
unicode-width = "0.2"
swash = "0.2.10"

# Rune's own patches, as the app has them (../Cargo.toml says why): the same crates from the same rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }

# Its own workspace, as the app's is: nothing here is a dependency of the app.
[workspace]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
