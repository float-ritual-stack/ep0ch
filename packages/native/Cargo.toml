[package]
name = "ep0ch-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ep0ch as a native window, drawn with Rune: it speaks the outline host's socket and draws what the host answers."
publish = false

[[bin]]
name = "ep0ch-native"
path = "src/main.rs"

# Rune is pre-release: pin a rev of its `dev` branch (never rewritten) and move it on purpose.
[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e", features = ["markdown", "mermaid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Picture bytes come over the wire as base64 (`media.read`).
base64 = "0.22"
# The terminal (the `pty` feature, off by default): Moonframe's emulator and the backends that keep a program
# (herdr-core when the machine has `hc`, then tmux, else a plain pty). One rev for both, moved on purpose. The
# emulator is alacritty's, in Rust: never its `ghostty` feature, which builds Ghostty's source with Zig (README,
# "The terminal").
moonframe-terminal = { git = "https://github.com/moonframehq/moonframe", rev = "b67a3de", default-features = false, features = ["alacritty"], optional = true }
moonframe-mux = { git = "https://github.com/moonframehq/moonframe", rev = "b67a3de", default-features = false, features = ["herdr-core", "terminal"], optional = true }

[features]
# A shell or an agent in a tile: `cargo build --features pty`. Without it the window is what it was, and pulls
# nothing new.
pty = ["dep:moonframe-terminal", "dep:moonframe-mux"]

# Rune's own patches, from the same rev as the pins above (Rune's README, "Depending on Rune"): a dependency's
# `[patch]` doesn't reach the workspace that depends on it, so without these the window builds against stock crates.
# winit carries the macOS input-method and Windows window-creation fixes, parley_engine the bidi and shaping fixes,
# wgpu-hal and accesskit_windows Rune's own changes. The list is the `[patch.crates-io]` table in Rune's root
# Cargo.toml: when a bump adds an entry there, add it here, and move every rev together with the pins.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a5360a637fe42f25462353afd06663321dadfc5e" }

# Its own workspace: the repository's packages are bun's, and cargo should never look above this folder.
[workspace]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
