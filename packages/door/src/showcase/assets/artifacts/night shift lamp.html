<title>Night shift lamp</title>
<!-- A fictional page for the showcase (PIE-1656): a file with spaces in its name, as a terminal's drop writes its path. -->
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; color: #c9b27c; font: 14px/1.5 system-ui, sans-serif; display: grid; place-items: center; }
  .lamp { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #f2c66d 0%, #8a5a1c 60%, transparent 70%); animation: glow 3s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }
</style>
</head>
<body>
<div><div class="lamp"></div><p>The night shift lamp, still on at the shed.</p></div>
